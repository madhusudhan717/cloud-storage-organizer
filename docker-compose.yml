services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: cloud-storage-organizer-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3-compatible API port
      - "9001:9001"   # MinIO Web Console port
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
    command: server /data --console-address ":9001"
    volumes:
      - minio_storage:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: cloud-storage-organizer-mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin123};
      mc mb --ignore-existing localminio/$${S3_BUCKET_NAME:-cloud-organizer-private};
      mc anonymous set none localminio/$${S3_BUCKET_NAME:-cloud-organizer-private};
      mc mb --ignore-existing localminio/$${S3_PUBLIC_DEMO_BUCKET:-cloud-organizer-public-sandbox};
      mc anonymous set none localminio/$${S3_PUBLIC_DEMO_BUCKET:-cloud-organizer-public-sandbox};
      echo 'Buckets initialized with strict private-by-default policy.';
      exit 0;
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-cloud-organizer-private}
      S3_PUBLIC_DEMO_BUCKET: ${S3_PUBLIC_DEMO_BUCKET:-cloud-organizer-public-sandbox}

volumes:
  minio_storage:
    driver: local
